{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">planner</span>
                <h1>ورود به Planner</h1>
                <p>خوش آمدید! وارد حساب خود شوید</p>
            </div>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" name="username" class="form-input" placeholder="نام کاربری" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" name="password" class="form-input" placeholder="رمز عبور" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">ورود</button>
            </form>
            <div class="auth-footer">
                <p>حساب ندارید؟ <a href="{% url 'register' %}">ثبت نام کنید</a></p>
            </div>
        </div>
    </div>
</body>
</html>

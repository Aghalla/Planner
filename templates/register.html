{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام - Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">planner</span>
                <h1>ساخت حساب جدید</h1>
                <p>به Planner خوش آمدید</p>
            </div>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>نام نمایشی</label>
                    <input type="text" name="display_name" class="form-input" placeholder="نام شما">
                </div>
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" name="username" class="form-input" placeholder="نام کاربری" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" name="password" class="form-input" placeholder="رمز عبور" required>
                </div>
                <div class="form-group">
                    <label>تکرار رمز عبور</label>
                    <input type="password" name="password2" class="form-input" placeholder="تکرار رمز عبور" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">ثبت نام</button>
            </form>
            <div class="auth-footer">
                <p>قبلاً ثبت نام کرده‌اید؟ <a href="{% url 'login' %}">ورود</a></p>
            </div>
        </div>
    </div>
</body>
</html>
